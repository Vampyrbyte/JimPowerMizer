name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  # Stable tags only from main; alpha/beta tags may come from another branch that includes all of main
  # (and, for 0.3, of midnight). See scripts/check-release-tag.sh.
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the tag may be released
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          scripts/check-release-tag.sh "$GITHUB_REF_NAME" origin

  # The same lint, locale and mock-API checks as CI: nothing is packaged if one fails.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tag-check, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Uploads to CurseForge / Wago happen only when these secrets are set and the TOC has
      # ## X-Curse-Project-ID / ## X-Wago-ID. A missing secret just skips that site.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check CurseForge token
        if: env.CF_API_TOKEN != ''
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/wow/versions)
          echo "CurseForge token check: HTTP $code (token length ${#CF_API_TOKEN})"
          if [ "$code" != "200" ]; then
            echo "::error::CurseForge rejected CF_API_TOKEN (HTTP $code). Use an upload token from https://authors.curseforge.com/account/api-tokens and check the secret has no extra spaces or newlines."
            exit 1
          fi
      # Label the upload only with the game versions of the TOCs it contains (scripts/package-args.sh).
      - name: Packager arguments
        id: pkg
        run: |
          args=$(scripts/package-args.sh)
          echo "Packager arguments: ${args:-(none)}"
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: BigWigsMods/packager@v2
        with:
          args: ${{ steps.pkg.outputs.args }}
