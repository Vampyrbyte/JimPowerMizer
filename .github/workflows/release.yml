name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Uploads to CurseForge / Wago happen only when these secrets are set and the TOC has
      # ## X-Curse-Project-ID / ## X-Wago-ID. A missing secret just skips that site.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
