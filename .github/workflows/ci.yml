name: CI

on:
  push:
    branches: [main, midnight, classic]
  pull_request:
  workflow_call: # the release workflow runs these checks before packaging

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint (luacheck)
        uses: lunarmodules/luacheck@v1

      - name: Locale file up to date
        run: python3 scripts/gen-locale.py --check

  # The client flavors this branch supports (tests/flavors, one per line).
  flavors:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          list=$(grep -v -e '^#' -e '^[[:space:]]*$' tests/flavors | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Flavors: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # One package supports several clients, so every change is tested as each of them.
  tests:
    needs: flavors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.flavors.outputs.list) }}
    name: tests (${{ matrix.flavor }})
    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      - name: Fetch libraries
        run: scripts/fetch-libs.sh

      - name: Mock-API tests (${{ matrix.flavor }})
        run: luajit tests/harness.lua . ${{ matrix.flavor }}
